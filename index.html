<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minis</title>
  <meta property="og:title" content="Minis" />
  <meta property="og:description" content="Small daily games for the group." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f3d3e;
      --sea: #e4f0ec;
      --glass: #c3e0d8;
      --mango: #ffc845;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--sea); color: var(--ink);
      font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; padding: 56px 20px 40px; }
    .title { display: flex; gap: 6px; margin: 0 0 14px; }
    .title span {
      width: clamp(52px, 13vw, 76px); aspect-ratio: 1; display: grid; place-items: center;
      background: var(--paper); border: 3px solid var(--ink); border-radius: 6px;
      font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
      font-size: clamp(1.8rem, 7vw, 2.8rem); position: relative;
    }
    .title span:nth-child(2) { background: var(--mango); }
    .title span::before {
      content: attr(data-n); position: absolute; top: 3px; left: 5px;
      font-family: "Atkinson Hyperlegible", sans-serif; font-size: .8rem; font-weight: 700;
    }
    .lede { font-size: 1.1rem; margin: 0 0 36px; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .card {
      display: flex; flex-direction: column; gap: 10px; padding: 22px; text-decoration: none; color: inherit;
      background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
      box-shadow: 6px 6px 0 var(--ink); transition: transform .15s, box-shadow .15s;
    }
    .card:hover, .card:focus-visible { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); outline: none; }
    .card:focus-visible { border-color: var(--mango); }
    .card .icon { font-size: 2rem; line-height: 1; }
    .card h2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.5rem; margin: 0; }
    .card p { margin: 0; line-height: 1.45; }
    .card .play { margin-top: auto; font-weight: 700; }
    .card .play::after { content: " \2192"; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1 class="title" aria-label="Minis">
      <span data-n="1">M</span><span>I</span><span data-n="2">N</span><span>I</span><span data-n="3">S</span>
    </h1>
    <p class="lede">Small games for the group. Pick one.</p>

    <section class="games">
      <a class="card" href="maptap.html">
        <span class="icon" aria-hidden="true">🌍</span>
        <h2>TapMap Daily</h2>
        <p>Find 6 places on the globe. The closer your tap, the more points you get.</p>
        <span class="play">Play</span>
      </a>
      <a class="card" href="crossword.html">
        <span class="icon" aria-hidden="true">✏️</span>
        <h2>The Trip Crossword</h2>
        <p>A mini crossword full of inside jokes from the trips. Only the crew will get these.</p>
        <span class="play">Play</span>
      </a>
    </section>
  </main>
</body>
</html>
