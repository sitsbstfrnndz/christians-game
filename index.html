<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>christians-minis</title>
  <link rel="icon" type="image/svg+xml" href="assets/maptap-icon.svg" />
  <meta property="og:title" content="christians-minis" />
  <meta property="og:description" content="A couple of little games made for Christian." />
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a33;
      --panel2: #18224a;
      --accent: #3b82f6;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1040px; margin: 0 auto; padding: 64px 20px 48px; }
    .hero { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .heroIcon {
      width: 58px; height: 58px; flex: 0 0 auto; display: grid; place-items: center;
      border-radius: 16px; background: var(--panel2); border: 1px solid rgba(148,163,184,.2);
      font-size: 1.8rem;
    }
    .eyebrow { margin: 0 0 3px; color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.1; letter-spacing: -.04em; }
    .lede { color: var(--muted); font-size: 1rem; margin: 0 0 32px 74px; }
    .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }
    .card {
      display: flex; flex-direction: column; gap: 12px; min-height: 240px; padding: 22px;
      text-decoration: none; color: inherit; background: var(--panel);
      border: 1px solid rgba(148,163,184,.2); border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.2); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px); border-color: rgba(59,130,246,.7);
      box-shadow: 0 18px 36px rgba(0,0,0,.32); outline: none;
    }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .card .icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px; background: var(--panel2); font-size: 1.5rem; }
    .card h2 { font-weight: 800; font-size: 1.3rem; letter-spacing: -.02em; margin: 0; }
    .card p { color: var(--muted); margin: 0; line-height: 1.5; }
    .card .play { margin-top: auto; color: #bfdbfe; font-weight: 750; }
    .card .play::after { content: "  →"; }
    @media (max-width: 520px) { main { padding-top: 42px; } .lede { margin-left: 0; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <span class="heroIcon" aria-hidden="true">🎮</span>
      <div><p class="eyebrow">Made for Christian</p><h1>christians-minis</h1></div>
    </div>
    <p class="lede">A couple of little games. Pick one.</p>

    <section class="games">
      <a class="card" href="maptap.html">
        <span class="icon" aria-hidden="true">🌍</span>
        <h2>Christian's MapTap</h2>
        <p>Find 6 places on the globe. The closer your tap, the more points you get.</p>
        <span class="play">Play</span>
      </a>
      <a class="card" href="crossword.html">
        <span class="icon" aria-hidden="true">✏️</span>
        <h2>Christian's Mini</h2>
        <p>A mini crossword full of inside jokes from the trips. Only the crew will get these.</p>
        <span class="play">Play</span>
      </a>
    </section>
  </main>
</body>
</html>
